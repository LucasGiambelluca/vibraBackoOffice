# Back office en https://rsgroupenter.com/backoffice. Se incluye dentro del server de
# rsgroupenter.com (sites-enabled/rsgroupenter), antes de `location /`:
#     include snippets/backoffice.conf;
# ^~ gana a las locations con regex del sitio estático (las que bloquean .json, .map, etc.).
location ^~ /backoffice {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Se pisa (no se agrega): la app limita los intentos de login por esta IP, y un
    # X-Forwarded-For que mande el cliente no tiene que poder cambiarla.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 150s;           # la lectura de PDF con IA puede tardar
    client_max_body_size 12m;          # archivos de hasta 10 MB + el multipart

    # Los headers de seguridad los pone la app (next.config.ts). Definir uno acá evita que se
    # hereden los del sitio estático, cuyo CSP (default-src 'none') rompería la app.
    add_header Strict-Transport-Security "max-age=31536000" always;
}
